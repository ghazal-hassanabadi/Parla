<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | Parla</title>

    <link rel="stylesheet" href="./src/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script type="module" src="js/index.js"></script>
</head>

<body class="flex min-h-screen flex-col overflow-x-hidden bg-paper font-vazir text-ink">

          <header class="bg-forest text-white">
    <section class="mx-auto flex flex-wrap items-center justify-between gap-x-6 gap-y-3 px-4 py-3 xl:grid xl:grid-cols-[1fr_auto_1fr] xl:items-center">

      <div class="contents xl:order-1 xl:flex xl:items-center xl:justify-self-start xl:gap-6">

        <ul class="order-2 flex items-center gap-5 text-lg xl:order-1">
          <li>
            <a href="signup.html" aria-label="حساب کاربری" class="hover:text-gold">
              <i class="fa-regular fa-user"></i>
            </a>
          </li>
          <li>
            <a href="#" aria-label="سبد خرید" class="hover:text-gold">
              <i class="fa-solid fa-bag-shopping"></i>
            </a>
          </li>
        </ul>

        <form role="search" class="relative order-3 w-full xl:order-2 xl:w-72">
          <input type="search" placeholder="جستجو..." class="h-9 w-full rounded-md bg-white/10 px-4 pl-10 text-sm text-white placeholder:text-white/60 focus:outline-none focus:ring-1 focus:ring-gold">
          <i class="fa-solid fa-magnifying-glass absolute top-1/2 left-3 -translate-y-1/2 text-sm text-white/70"></i>
        </form>

      </div>

      <nav class="order-4 w-full border-t border-white/15 pt-3 xl:order-2 xl:w-auto xl:justify-self-center xl:border-t-0 xl:pt-0">
        <ul class="flex justify-center gap-6 text-tiny xl:text-lg xl:gap-8">
          <li><a href="index.html" class="hover:text-gold">خانه</a></li>
          <li><a href="#product" class="hover:text-gold">فروشگاه</a></li>
          <li><a href="#category" class="hover:text-gold">دسته‌بندی‌ها</a></li>
          <li><a href="#about" class="hover:text-gold">درباره ما</a></li>
          <li><a href="contact.html" class="hover:text-gold">تماس با ما</a></li>
        </ul>
      </nav>

      <a href="index.html" class="order-1 text-center leading-none xl:order-3 xl:justify-self-end">
        <strong class="block font-display text-3xl font-medium tracking-[0.2em] text-gold xl:text-4xl">PARLA</strong>
        <small class="block font-display text-tiny tracking-[0.5em] text-gold-soft">JEWELRY</small>
      </a>

    </section>
  </header>

  <main class="flex flex-1 items-center justify-center bg-linen px-4 py-6">

    <article class="relative grid w-full max-w-5xl overflow-hidden rounded-3xl bg-parchment shadow-lg xl:min-h-195 xl:grid-cols-[1.2fr_1fr]">

      <img src="image/branch-corner.png" alt="" aria-hidden="true" class="pointer-events-none absolute top-0 right-0 w-24 xl:w-40">

      <section class="px-6 py-10 xl:px-14 xl:py-12">

        <header class="text-center">
          <a href="index.html" class="inline-block leading-none">
            <strong class="block font-display text-4xl font-medium tracking-[0.2em] text-moss xl:text-5xl">PARLA</strong>
            <small class="block font-display text-tiny tracking-[0.5em] text-moss">JEWELRY</small>
          </a>
        </header>

        <hgroup class="mt-8">
          <h1 class="text-xl font-bold xl:text-2xl">خوش برگشتی!</h1>
          <p class="mt-2 text-xs text-ink/70">برای ورود به حساب کاربری، اطلاعات خود را وارد کنید</p>
        </hgroup>

        <form class="mt-6 flex flex-col gap-3">

          <label class="relative block">
            <span class="sr-only">شماره موبایل</span>
            <input type="tel" name="mobile" inputmode="numeric" autocomplete="tel" placeholder="شماره موبایل" required class="h-12 w-full rounded-xl border border-stone bg-white/40 px-4 pl-11 text-sm placeholder:text-ink/60 focus:border-moss focus:outline-none">
            <i class="fa-solid fa-mobile-screen absolute top-1/2 left-4 -translate-y-1/2 text-moss"></i>
          </label>

          <label class="relative block">
            <span class="sr-only">رمز عبور</span>
            <input type="password" name="password" autocomplete="current-password" placeholder="رمز عبور" required class="h-12 w-full rounded-xl border border-stone bg-white/40 px-4 pl-11 text-sm placeholder:text-ink/60 focus:border-moss focus:outline-none">
            <i class="fa-solid fa-lock absolute top-1/2 left-4 -translate-y-1/2 text-moss"></i>
          </label>

          <p class="flex items-center justify-between text-xs">
            <label class="flex items-center gap-2">
              <input type="checkbox" name="remember" class="size-4 accent-olive-card">
              مرا به خاطر بسپار
            </label>
            <a href="#" class="underline underline-offset-4">رمز عبور را فراموش کرده‌اید؟</a>
          </p>

          <button type="submit" class="flex h-12 w-full cursor-pointer items-center justify-center gap-3 rounded-xl bg-olive-card text-white transition duration-300 hover:bg-forest">
            ورود
            <i class="fa-solid fa-arrow-left-long"></i>
          </button>

        </form>

        <section class="mt-6">
          <p class="flex items-center gap-3 text-xs text-ink/70 before:h-px before:flex-1 before:bg-stone after:h-px after:flex-1 after:bg-stone">
            با حساب‌های دیگر وارد شوید
          </p>
          <ul class="mt-4 flex justify-center gap-3">
            <li>
              <a href="#" aria-label="ورود با گوگل" class="grid size-11 place-items-center rounded-full border border-stone bg-white/50 text-moss hover:border-moss">
                <i class="fa-brands fa-google"></i>
              </a>
            </li>
            <li>
              <a href="#" aria-label="ورود با تلگرام" class="grid size-11 place-items-center rounded-full border border-stone bg-white/50 text-moss hover:border-moss">
                <i class="fa-brands fa-telegram"></i>
              </a>
            </li>
            <li>
              <a href="#" aria-label="ورود با اینستاگرام" class="grid size-11 place-items-center rounded-full border border-stone bg-white/50 text-moss hover:border-moss">
                <i class="fa-brands fa-instagram"></i>
              </a>
            </li>
          </ul>
        </section>

        <p class="mt-6 text-center text-xs">
          حساب کاربری ندارید؟
          <a href="signup.html" class="font-medium underline underline-offset-4">ثبت نام</a>
        </p>

      </section>

      <div class="relative hidden xl:block">
         <img src="image/signin.png" alt="" class="absolute inset-0 size-full object-cover object-top">
      </div>

    </article>

  </main>

</body>
</html>
